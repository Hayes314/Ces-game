<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>香港經濟貢獻 · 無限爬升 | CES中三專題</title>
<style>
  *, *::before, *::after {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --cyan: #4dd8ff;
    --gold: #ffd966;
    --green: #7dffb0;
    --danger: #ef4444;
    --border: #1e4d6b;
    --border-bright: #2f6b8f;
    --text: #e0f0ff;
    --text-dim: #7a9db5;
    --font: 'PingFang HK', 'Microsoft JhengHei', 'Segoe UI', sans-serif;
  }

  html, body {
    height: 100%;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: touch;
  }

  html, body, .app, .topbar, .content-row, .controls-row,
  .ai-panel, .ai-msg, .ai-head, .ai-tip, .ai-action-btn, .ai-zoom-btn,
  .game-col, .canvas-wrap, canvas, .joystick,
  .joystick .fill, .joystick .knob, .jump-btn,
  .stat, .brand, .action-btn, h1, p, span, b, small, li, ul, div {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-drag: none;
  }

  .ai-msg {
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background: radial-gradient(ellipse at 20% 0%, #0e2336 0%, #050b14 70%);
    font-family: var(--font);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    width: 100%;
    cursor: default;
  }

  .app {
    width: 100%;
    height: 100%;
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }

  .topbar {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    background: linear-gradient(180deg, rgba(15, 34, 50, 0.95), rgba(7, 17, 27, 0.95));
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 4px 16px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex-shrink: 1; }

  .brand-badge {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #ffd966, #e6a33a);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.15rem; flex-shrink: 0;
    box-shadow: 0 3px 8px rgba(255, 217, 102, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }

  .brand h1 {
    font-size: 1.05rem; font-weight: 800; letter-spacing: 0.3px;
    background: linear-gradient(90deg, #ffd966 0%, #6ec8ff 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .brand h1 span { font-size: 0.72rem; font-weight: 600; opacity: 0.9; }

  .stats { display: flex; gap: 6px; flex: 0 0 auto; }

  .stat {
    display: flex; flex-direction: column; align-items: center;
    padding: 4px 12px; background: linear-gradient(180deg, #112b3f, #0a1a28);
    border: 1px solid var(--border-bright); border-radius: 10px;
    min-width: 66px; line-height: 1;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .stat small { font-size: 0.55rem; color: var(--text-dim); letter-spacing: 0.8px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; }
  .stat b { font-size: 0.98rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat b.gold { color: var(--gold); text-shadow: 0 0 10px rgba(255, 217, 102, 0.5); }
  .stat b.green { color: var(--green); text-shadow: 0 0 10px rgba(125, 255, 176, 0.5); }
  .stat b.cyan { color: var(--cyan); text-shadow: 0 0 10px rgba(77, 216, 255, 0.5); }

  .stat b.bump { animation: statBump 0.25s ease-out; }
  @keyframes statBump { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

  .top-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .action-btn {
    background: linear-gradient(180deg, #1a4159 0%, #0d2a3f 100%);
    border: 1px solid var(--border-bright); border-radius: 24px;
    padding: 8px 16px; color: var(--text); font-weight: 700; font-size: 0.82rem;
    cursor: pointer; transition: all 0.12s ease;
    box-shadow: 0 3px 0 #07141f, 0 4px 10px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    font-family: inherit; white-space: nowrap; touch-action: manipulation;
  }

  .action-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #07141f; }

  .action-btn.primary {
    background: linear-gradient(180deg, #ffc04d 0%, #d69030 100%);
    border-color: #ffe08a; color: #fff;
    box-shadow: 0 3px 0 #8a5a10, 0 4px 14px rgba(201, 136, 42, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
  }

  .action-btn.primary:active { box-shadow: 0 0 0 #8a5a10; }
  .action-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
  .action-btn.icon-only { padding: 8px 10px; font-size: 0.95rem; }

  .content-row {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: row;
    gap: 10px;
  }

  .game-col {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    display: flex;
    position: relative;
  }

  .canvas-wrap {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    padding: 3px;
    border-radius: 20px;
    background: linear-gradient(135deg, #4dd8ff 0%, #c084fc 50%, #ffd966 100%);
    box-shadow:
      0 0 40px rgba(77, 216, 255, 0.35),
      0 0 80px rgba(192, 132, 252, 0.2),
      0 14px 40px rgba(0, 0, 0, 0.75);
    position: relative;
    display: flex;
  }

  .canvas-wrap::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 17px;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.06) 2px, rgba(0, 0, 0, 0.06) 3px);
    mix-blend-mode: overlay;
  }

  .canvas-wrap canvas {
    display: block;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    border-radius: 17px;
    touch-action: none;
    cursor: pointer;
  }

  /* ============================================================
     AI 面板（支持文字缩放）
     ============================================================ */
  .ai-panel {
    --ai-zoom: 1;
    flex: 0 0 340px;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: linear-gradient(180deg, #0d1f2e 0%, #081420 100%);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 8px 24px rgba(0, 0, 0, 0.5);
  }

  .ai-panel.text-zoom {
    --ai-zoom: 1.38;
  }

  .ai-panel::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    animation: scanLight 3s linear infinite;
  }

  @keyframes scanLight { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  .ai-head {
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 10px; border-bottom: 1px solid rgba(30, 77, 107, 0.6); flex-shrink: 0;
  }

  .ai-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #6ec8ff, #2b78b8);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; flex-shrink: 0; position: relative;
    animation: avatarBreath 2.5s ease-in-out infinite;
  }

  @keyframes avatarBreath {
    0%, 100% { box-shadow: 0 0 10px rgba(110, 200, 255, 0.4); }
    50% { box-shadow: 0 0 24px rgba(110, 200, 255, 0.9); }
  }

  .ai-avatar::after {
    content: ''; position: absolute; bottom: 1px; right: 1px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--green); border: 2px solid #081420;
    box-shadow: 0 0 8px var(--green); animation: onlineDot 1.5s ease-in-out infinite;
  }

  @keyframes onlineDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .ai-head-text { min-width: 0; }
  .ai-head-text h3 { font-size: 0.9rem; color: var(--cyan); font-weight: 700; }
  .ai-head-text p { font-size: 0.62rem; color: var(--text-dim); margin-top: 2px; }

  /* ===== 放大閱讀按鈕 ===== */
  .ai-zoom-btn {
    margin-left: auto;
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(180deg, #1a4159, #0d2a3f);
    border: 1px solid var(--border-bright);
    color: var(--cyan);
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    box-shadow: 0 2px 0 #07141f, inset 0 1px 0 rgba(255, 255, 255, 0.12);
    touch-action: manipulation;
    outline: none;
    padding: 0;
    line-height: 1;
    letter-spacing: -0.5px;
  }

  .ai-zoom-btn:hover { background: linear-gradient(180deg, #235070, #113048); color: #6ec8ff; }
  .ai-zoom-btn:active { transform: translateY(2px); box-shadow: 0 0 0 #07141f, inset 0 1px 0 rgba(255, 255, 255, 0.05); }

  .ai-zoom-btn .zoom-off { display: none; }
  .ai-panel.text-zoom .ai-zoom-btn .zoom-on { display: none; }
  .ai-panel.text-zoom .ai-zoom-btn .zoom-off { display: inline; }

  .ai-panel.text-zoom .ai-zoom-btn {
    background: linear-gradient(180deg, #2a6a8f, #17425f);
    color: var(--gold);
    border-color: #4a7a9c;
    box-shadow: 0 2px 0 #07141f, 0 0 12px rgba(255, 217, 102, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  }

  /* AI 对话框：字号随 --ai-zoom 缩放 */
  .ai-msg {
    flex: 1 1 auto; min-height: 0;
    background: rgba(16, 36, 51, 0.9);
    border-radius: 4px 14px 14px 14px;
    border-left: 3px solid var(--cyan);
    padding: 12px;
    font-size: calc(0.82rem * var(--ai-zoom));
    line-height: 1.7;
    color: #c2dcee; overflow-y: auto;
    box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.3);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }

  .ai-msg::-webkit-scrollbar { width: 4px; }
  .ai-msg::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 4px; }
  .ai-msg .stat { color: var(--green); font-weight: 700; background: rgba(125, 255, 176, 0.1); padding: 0 4px; border-radius: 3px; white-space: nowrap; }
  .ai-msg .hl { color: var(--gold); font-weight: 700; }

  .ai-msg.updated { animation: msgPop 0.35s ease-out; }
  @keyframes msgPop { 0% { opacity: 0; transform: translateY(8px) scale(0.97); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

  .ai-msg .detail-header {
    display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 1px dashed rgba(77, 216, 255, 0.3);
  }
  .ai-msg .detail-icon { font-size: calc(1.2rem * var(--ai-zoom)); line-height: 1; }
  .ai-msg .detail-title { font-size: calc(0.9rem * var(--ai-zoom)); font-weight: 800; color: var(--gold); letter-spacing: 0.3px; }
  .ai-msg .detail-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .ai-msg .detail-list li { padding-left: 16px; position: relative; font-size: calc(0.78rem * var(--ai-zoom)); line-height: 1.65; color: #b8d4e8; }
  .ai-msg .detail-list li::before { content: '▸'; position: absolute; left: 0; top: 0; color: var(--cyan); font-weight: 700; }
  .ai-msg .detail-list li b { color: var(--gold); font-weight: 700; }
  .ai-msg .detail-list li .stat { color: var(--green); font-weight: 700; background: rgba(125, 255, 176, 0.1); padding: 0 3px; border-radius: 3px; }
  .ai-msg .detail-footer { margin-top: 12px; padding-top: 8px; border-top: 1px dashed rgba(77, 216, 255, 0.2); font-size: calc(0.66rem * var(--ai-zoom)); color: var(--text-dim); text-align: center; }

  .ai-action-btn {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 14px;
    background: linear-gradient(180deg, #1a4159, #0d2a3f);
    border: 1px solid var(--border-bright);
    border-radius: 12px;
    color: var(--cyan);
    font-weight: 700;
    font-size: calc(0.78rem * var(--ai-zoom));
    letter-spacing: 0.5px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.12s ease;
    box-shadow: 0 2px 0 #07141f, 0 4px 10px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    flex-shrink: 0;
    touch-action: manipulation;
    outline: none;
  }

  .ai-action-btn.visible { display: flex; }
  .ai-action-btn:hover { background: linear-gradient(180deg, #235070, #113048); color: #6ec8ff; }
  .ai-action-btn:active { transform: translateY(2px); box-shadow: 0 0 0 #07141f, 0 2px 6px rgba(0, 0, 0, 0.4); }
  .ai-action-btn.detail-mode { background: linear-gradient(180deg, #2a4d6b, #163048); color: var(--gold); border-color: #4a7a9c; }
  .ai-action-btn.detail-mode:hover { background: linear-gradient(180deg, #335d80, #1a3a54); color: #ffe08a; }
  .ai-action-btn .label-full { display: inline; }
  .ai-action-btn .label-short { display: none; }

  .ai-tip { font-size: 0.66rem; color: var(--text-dim); text-align: right; min-height: 14px; flex-shrink: 0; }

  /* ============================================================
     底部控制栏：左横向摇杆 + 右跳跃
     ============================================================ */
  .controls-row {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(15, 34, 50, 0.98), rgba(7, 17, 27, 0.98));
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 8px 24px rgba(0, 0, 0, 0.5);
  }

  /* ============================================================
     严格一维水平摇杆
     轨道高度 = 摇杆头高度 + 8px（上下各留 4px）
     摇杆头几乎填满轨道高度，视觉上只能水平滑动
     ============================================================ */
  .joystick {
    --track-h: 80px;
    --knob-size: 72px;

    position: relative;
    flex: 1 1 auto;
    max-width: 440px;
    height: var(--track-h);
    border-radius: calc(var(--track-h) / 2);
    background: linear-gradient(180deg, #0f2233 0%, #081420 100%);
    border: 2px solid var(--border-bright);
    box-shadow:
      inset 0 4px 14px rgba(0, 0, 0, 0.7),
      inset 0 -1px 0 rgba(255, 255, 255, 0.06),
      0 4px 14px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .joystick.active {
    cursor: grabbing;
    border-color: var(--cyan);
    box-shadow:
      inset 0 4px 14px rgba(0, 0, 0, 0.7),
      inset 0 -1px 0 rgba(255, 255, 255, 0.08),
      0 0 24px rgba(77, 216, 255, 0.35),
      0 4px 14px rgba(0, 0, 0, 0.5);
  }

  /* 中心刻线：只做水平参考 */
  .joystick::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    height: calc(var(--track-h) * 0.4);
    margin-top: calc(var(--track-h) * -0.2);
    margin-left: -1px;
    border-radius: 1px;
    background: rgba(77, 216, 255, 0.22);
    pointer-events: none;
    z-index: 1;
  }

  /* 左右箭头提示 */
  .joystick::after {
    content: "◀\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0\A0▶";
    position: absolute;
    left: 16px;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(77, 216, 255, 0.16);
    font-size: 0.68rem;
    letter-spacing: 0;
    text-align: center;
    pointer-events: none;
    z-index: 1;
    white-space: nowrap;
    overflow: hidden;
  }

  /* 方向填充条 */
  .fill {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 8px;
    margin-top: -4px;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    transition: opacity 0.18s ease;
  }

  /* ===== 摇杆头：严格垂直居中，只允许水平位移 ===== */
  .knob {
    position: absolute;
    left: 50%;
    top: 50%;
    /* 用 margin 固定垂直居中，绝不使用 translateY */
    margin-top: calc(var(--knob-size) / -2);
    margin-left: calc(var(--knob-size) / -2);
    width: var(--knob-size);
    height: var(--knob-size);
    border-radius: 50%;
    background: radial-gradient(circle at 36% 28%,
                #9fe8ff 0%, #2b9fd0 48%, #16546f 100%);
    border: 2px solid rgba(255, 255, 255, 0.35);
    box-shadow:
      0 6px 14px rgba(0, 0, 0, 0.6),
      0 0 14px rgba(77, 216, 255, 0.25),
      inset 0 3px 4px rgba(255, 255, 255, 0.5),
      inset 0 -4px 8px rgba(0, 0, 0, 0.4);
    display: grid;
    place-items: center;
    will-change: transform;
    /* 只允许 translateX，垂直方向由 margin + top 完全固定 */
    transition: transform 0.28s cubic-bezier(.22, 1, .36, 1),
                box-shadow 0.2s ease;
    pointer-events: none;
    z-index: 2;
  }

  .knob::after {
    content: "";
    width: calc(var(--knob-size) * 0.32);
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.55);
    box-shadow: 0 0 10px rgba(180, 240, 255, 0.7);
  }

  .joystick.active .knob {
    transition: box-shadow 0.2s ease;
    box-shadow:
      0 4px 10px rgba(0, 0, 0, 0.65),
      0 0 24px rgba(77, 216, 255, 0.55),
      inset 0 3px 4px rgba(255, 255, 255, 0.6),
      inset 0 -4px 8px rgba(0, 0, 0, 0.4);
  }

  /* ===== 跳跃按钮 ===== */
  .jump-btn {
    flex: 0 0 auto;
    width: 180px;
    height: 84px;
    border-radius: 20px;
    background: linear-gradient(180deg, #ffc04d 0%, #d69030 100%);
    border: 2px solid #ffe08a;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: transform 0.08s, box-shadow 0.08s, background 0.1s;
    box-shadow: 0 5px 0 #8a5a10, 0 7px 22px rgba(201, 136, 42, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    user-select: none;
    -webkit-user-select: none;
    font-family: inherit;
    touch-action: none;
    position: relative;
    overflow: hidden;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    -webkit-touch-callout: none;
    outline: none;
  }

  .jump-btn::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.25) 50%, transparent 60%);
    transform: translateX(-100%);
    transition: transform 0.6s;
  }

  .jump-btn:hover::before { transform: translateX(100%); }
  .jump-btn:hover { background: linear-gradient(180deg, #ffce6b 0%, #e6a33a 100%); }

  .jump-btn:active,
  .jump-btn.pressed {
    transform: translateY(5px);
    box-shadow: 0 0 0 #8a5a10, 0 3px 8px rgba(201, 136, 42, 0.4);
    background: linear-gradient(180deg, #d69030 0%, #b07420 100%);
  }

  .jump-arrow { font-size: 1.8rem; line-height: 1; filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.6)); }
  .jump-text { font-size: 1.1rem; font-weight: 800; letter-spacing: 2px; }
  .jump-hint { font-size: 0.68rem; opacity: 0.9; letter-spacing: 0.5px; }

  /* ============================================================
     响应式断点
     ============================================================ */

/* ============================================================
   严格一维水平摇杆
   ★ 所有输入只取 clientX，绝不处理 clientY
   ★ 摇杆头只使用 translateX，垂直位置由 top:50% + margin 固定
   ============================================================ */
const POS_GRAD = 'linear-gradient(90deg, rgba(77,216,255,0) 0%, rgba(77,216,255,.95) 100%)';
const NEG_GRAD = 'linear-gradient(270deg, rgba(255,217,102,0) 0%, rgba(255,217,102,.95) 100%)';

const joystickState = {
  active: false,
  pointerId: null,
  maxOffset: 1,
  grabOffset: 0,
  direction: 0     // -1 = 左, 0 = 停, 1 = 右
};

function measureJoystick() {
  joystickState.maxOffset = Math.max(1, (joystick.clientWidth - knob.offsetWidth) / 2);
}

/* ★ 只做水平位移：translateX，绝无 translateY */
function renderJoystickVisual(offset) {
  const clamped = Math.max(-1, Math.min(1, offset));
  const x = clamped * joystickState.maxOffset;
  knob.style.transform = 'translateX(' + x + 'px)';

  const w = Math.abs(x);
  fill.style.width = w + 'px';
  fill.style.left = clamped >= 0 ? '50%' : 'calc(50% - ' + w + 'px)';
  fill.style.background = clamped >= 0 ? POS_GRAD : NEG_GRAD;
  fill.style.opacity = w > 2 ? '1' : '0';
}

function setDirection(dir) {
  joystickState.direction = dir;
  keys.left = dir < 0;
  keys.right = dir > 0;
}

function resetJoystick() {
  setDirection(0);
  renderJoystickVisual(0);
  joystick.classList.remove('active');
}

/* ★ 只取 clientX，不处理 clientY */
function applyFromPointer(clientX) {
  const rect = joystick.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const dx = clientX - centerX - joystickState.grabOffset;
  const raw = dx / joystickState.maxOffset;

  renderJoystickVisual(raw);

  const dz = 0.22;
  if (raw < -dz) setDirection(-1);
  else if (raw > dz) setDirection(1);
  else setDirection(0);
}

joystick.addEventListener('pointerdown', (e) => {
  if (joystickState.active) return;
  e.preventDefault();

  measureJoystick();

  joystickState.active = true;
  joystickState.pointerId = e.pointerId;
  joystick.classList.add('active');

  try { joystick.setPointerCapture(e.pointerId); } catch (_) {}

  /* ★ 只用 clientX 计算抓取偏移，垂直位置无关 */
  const rect = joystick.getBoundingClientRect();
  const dx = e.clientX - (rect.left + rect.width / 2);
  const off = dx - joystickState.direction * joystickState.maxOffset;
  joystickState.grabOffset = Math.abs(off) <= knob.offsetWidth / 2 ? off : 0;

  applyFromPointer(e.clientX);
  hapticTap();
});

joystick.addEventListener('pointermove', (e) => {
  if (!joystickState.active || e.pointerId !== joystickState.pointerId) return;
  e.preventDefault();
  /* ★ 只传 clientX，clientY 完全不参与 */
  applyFromPointer(e.clientX);
});

function endJoystickDrag(e) {
  if (!joystickState.active) return;
  if (e && e.pointerId !== undefined && e.pointerId !== joystickState.pointerId) return;

  joystickState.active = false;
  joystickState.pointerId = null;
  joystickState.grabOffset = 0;

  void knob.offsetWidth;
  joystick.classList.remove('active');

  setDirection(0);
  renderJoystickVisual(0);
}

joystick.addEventListener('pointerup', endJoystickDrag);
joystick.addEventListener('pointercancel', endJoystickDrag);
joystick.addEventListener('lostpointercapture', endJoystickDrag);
joystick.addEventListener('contextmenu', e => e.preventDefault());

function updateJoystickVisualFromKeys() {
  if (joystickState.active) return;
  const dir = keys.right ? 1 : (keys.left ? -1 : 0);
  setDirection(dir);
  renderJoystickVisual(dir);
  if (dir !== 0) joystick.classList.add('active');
  else joystick.classList.remove('active');
}

/* ============================================================
   画布尺寸自适应
   ============================================================ */
function resizeCanvas() {
  const displayW = canvas.clientWidth;
  const displayH = canvas.clientHeight;
  if (displayW <= 0 || displayH <= 0) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = displayW * dpr;
  canvas.height = displayH * dpr;

  const scale = displayH / LOGICAL_H;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);

  CW = LOGICAL_H * (displayW / displayH);

  if (player) {
    if (player.x + player.w > CW) player.x = Math.max(0, CW - player.w);
    if (player.x < 0) player.x = 0;
  }
  platforms = platforms.filter(p => p.x < CW);
  badges = badges.filter(b => b.x < CW);

  measureJoystick();

  draw();
}

];

const knowledgeShown = {};
BADGE_TYPES.forEach(t => { knowledgeShown[t.id] = []; });

function pickKnowledge(typeId) {
  const pool = AI_KNOWLEDGE[typeId];
  const shown = knowledgeShown[typeId];
  if (shown.length >= pool.length) shown.length = 0;
  const remaining = [];
  for (let i = 0; i < pool.length; i++) if (!shown.includes(i)) remaining.push(i);
  const idx = remaining[Math.floor(Math.random() * remaining.length)];
  shown.push(idx);
  return pool[idx];
}

/* ============================================================
   工具
   ============================================================ */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function bumpEl(el) {
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}

function setAIMessage(html) {
  aiMessage.innerHTML = html;
  aiMessage.classList.remove('updated');
  void aiMessage.offsetWidth;
  aiMessage.classList.add('updated');
  aiMessage.scrollTop = 0;
}

function updateHUD() {
  if (altitudeDisplay.textContent !== String(altitude)) { altitudeDisplay.textContent = altitude; bumpEl(altitudeDisplay); }
  if (badgeDisplay.textContent !== String(badgeCount)) { badgeDisplay.textContent = badgeCount; bumpEl(badgeDisplay); }
  if (scoreDisplay.textContent !== String(score)) { scoreDisplay.textContent = score; bumpEl(scoreDisplay); }
}

function buildDetailHtml(badgeId) {

/* ============================================================
   初始化
   ============================================================ */
function initGame() {
  player.x = CW / 2 - PLAYER_W / 2;
  player.y = BASE_Y - PLAYER_H;
  player.vx = 0; player.vy = 0; player.canDoubleJump = true;

  cameraY = player.y - CH * 0.58;
  highestY = BASE_Y;

  platforms = [{ x: 0, y: BASE_Y, w: CW, h: PLATFORM_H, type: 'normal' }];
  badges = []; particles = [];

  for (let i = 0; i < 14; i++) {
    const gap = 78 + Math.random() * 32;
    const py = highestY - gap;
    let pw = 80 + Math.random() * 45;
    pw = Math.min(pw, CW * 0.45);
    const px = Math.random() * Math.max(1, (CW - pw));
    platforms.push({ x: px, y: py, w: pw, h: PLATFORM_H, type: 'normal' });
    highestY = py;

    if (Math.random() < 0.45) {
      const bt = BADGE_TYPES[Math.floor(Math.random() * BADGE_TYPES.length)];
      badges.push({ x: px + pw / 2, y: py - 46, size: 32, phase: Math.random() * Math.PI * 2, ...bt });
    }
  }

  score = 0; badgeCount = 0; altitude = 0; combo = 0; comboTimer = 0; aiCooldown = 0;
  milestonesHit = new Set();
  typesCollected = new Set();
  BADGE_TYPES.forEach(t => { knowledgeShown[t.id] = []; });
  keys.left = false; keys.right = false;

  altitudeDisplay.textContent = '0';
  badgeDisplay.textContent = '0';
  scoreDisplay.textContent = '0';

  hideMoreButton();
  resetJoystick();
}

/* ============================================================
   生成 & 清理
   ============================================================ */
function generatePlatforms() {
  while (highestY > cameraY - 420) {
    const diff = Math.min(altitude / 45, 36);
    const gap = 66 + Math.random() * 36 + diff;
    const py = highestY - gap;
    let pw = Math.max(62, 108 - diff * 0.35 + Math.random() * 38);
    pw = Math.min(pw, CW * 0.45);
    const px = Math.random() * Math.max(1, (CW - pw));

    let type = 'normal';
    if (altitude > 150 && Math.random() < 0.15) type = 'danger';

    platforms.push({ x: px, y: py, w: pw, h: PLATFORM_H, type });
    highestY = py;

    if (Math.random() < 0.42 && type === 'normal') {
      const bt = BADGE_TYPES[Math.floor(Math.random() * BADGE_TYPES.length)];
      badges.push({ x: px + pw / 2, y: py - 46, size: 32, phase: Math.random() * Math.PI * 2, ...bt });
    }
  }
}

function cleanupObjects() {
  platforms = platforms.filter(p => p.y - cameraY < CH + 140);
  badges = badges.filter(b => b.y - cameraY < CH + 140);
}

/* ============================================================
   粒子
   ============================================================ */
function spawnParticles(x, y, color, count, power) {
  for (let i = 0; i < count; i++) {
    const a = (Math.PI * 2 / count) * i + Math.random() * 0.5;
    const sp = (1.5 + Math.random() * 2.5) * (power || 1);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, r: 2 + Math.random() * 2.5, life: 26 + Math.random() * 12, maxLife: 38, color });
  }
}

/* ============================================================
   跳躍
   ============================================================ */
function doJump() {
  if (gameState === 'menu' || gameState === 'gameover') { startGame(); return; }
  if (gameState !== 'playing') return;
  if (!player.canDoubleJump) return;

  player.vy = JUMP_V * 0.92;
  player.canDoubleJump = false;
  spawnParticles(player.x + player.w / 2, player.y + player.h, '#6ec8ff', 9, 1.1);

  btnJump.classList.add('pressed');
  setTimeout(() => btnJump.classList.remove('pressed'), 130);
  hapticTap();
}

/* ============================================================
   更新
   ============================================================ */
function update() {
  const dir = joystickState.direction;
  if (dir !== 0) {
    player.vx = dir * MOVE_SPEED;
  } else {
    player.vx *= 0.78;
  }
  player.x += player.vx;

  if (player.x + player.w < 0) player.x = CW;
  if (player.x > CW) player.x = -player.w;

  player.vy += GRAVITY;
  const prevY = player.y;
  player.y += player.vy;

  if (player.vy > 0) {
    for (const p of platforms) {
      const prevBottom = prevY + player.h;
      const currBottom = player.y + player.h;
      if (prevBottom <= p.y + 2 && currBottom >= p.y &&
          player.x + player.w - 6 > p.x && player.x + 6 < p.x + p.w) {
        if (p.type === 'danger') {
          spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ef4444', 18, 1.6);
          endGame(); return;
        }
        player.y = p.y - player.h;
        player.vy = JUMP_V;
        player.canDoubleJump = true;
        spawnParticles(player.x + player.w / 2, p.y, '#5fe0ff', 5, 0.7);
        break;
      }
    }
  }

  const targetCam = player.y - CH * 0.58;
  if (targetCam < cameraY) cameraY = targetCam;

  generatePlatforms();
  cleanupObjects();

  const pcx = player.x + player.w / 2;
  const pcy = player.y + player.h / 2;
  for (let i = badges.length - 1; i >= 0; i--) {
    const b = badges[i];
    const dx = pcx - b.x, dy = pcy - b.y;
    if (Math.hypot(dx, dy) < b.size / 2 + 20) collectBadge(b, i);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.14; pt.vx *= 0.98; pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  const newAlt = Math.max(0, Math.floor((BASE_Y - (player.y + player.h)) / 8));
  if (newAlt > altitude) {
    score += (newAlt - altitude) * 2;
    altitude = newAlt;
    updateHUD();
  }

  if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) combo = 0; }
  if (aiCooldown > 0) aiCooldown--;

  for (const m of MILESTONES) {
    if (altitude >= m.h && !milestonesHit.has(m.h)) {
      milestonesHit.add(m.h);
      if (aiCooldown <= 0) {
        setAIMessage('<span class="hl">🎉 成就解鎖</span><br>' + m.msg);
        hideMoreButton();
        aiCooldown = 200;
      }
    }
  }

  if (player.y - cameraY > CH + 80) { endGame(); return; }
}

/* ============================================================
   收集徽章
   ============================================================ */
function collectBadge(b, index) {
  badges.splice(index, 1);
  combo = comboTimer > 0 ? combo + 1 : 1;
  comboTimer = 130;

  const comboBonus = (combo - 1) * 15;
  const gain = 30 + comboBonus;
  score += gain; badgeCount++; typesCollected.add(b.id);
  updateHUD();

  spawnParticles(b.x, b.y, b.color, 14, 1.2);
  hapticTap();

  if (aiCooldown <= 0) {
    const know = pickKnowledge(b.id);
    const comboLine = combo > 1
      ? `<span class="hl">COMBO ×${combo}</span>　+${gain} 分<br><br>`
      : `執到 <b>${b.icon} ${b.label}徽章</b>　+${gain} 分<br><br>`;
    showBadgeKnowledge(b.id, comboLine + know);
    aiCooldown = 170;
    aiTip.textContent = '💡 點擊「了解更多」睇深入數據';
  }
}

/* ============================================================

/* ============================================================
   繪製
   ============================================================ */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, '#050b14'); g.addColorStop(0.45, '#0b1e30');
  g.addColorStop(0.8, '#133048'); g.addColorStop(1, '#1b3f5c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);

  const starPar = cameraY * 0.08;
  ctx.fillStyle = 'rgba(200, 230, 255, 0.5)';
  for (let i = 0; i < 55; i++) {
    const sx = (i * 131 + 37) % CW;
    const sy = ((i * 79 - starPar) % CH + CH) % CH;
    const sr = (i % 3) * 0.4 + 0.6;
    ctx.globalAlpha = 0.3 + (i % 5) * 0.12;
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const factor = 0.38, parY = cameraY * factor, rowH = 175;
  const startRow = Math.floor((parY - 350) / rowH);

  for (let r = startRow; r < startRow + 9; r++) {
    const worldY = r * rowH, screenY = worldY - parY;
    if (screenY < -320 || screenY > CH + 120) continue;
    for (let i = 0; i < 12; i++) {
      const seed = Math.abs(r * 37 + i * 53 + 101) % 997;
      const bw = 32 + (seed % 34), bh = 50 + ((seed * 7) % 100);
      const bx = i * 52 + ((seed * 11) % 26) - 34;
      ctx.fillStyle = 'rgba(9, 22, 38, 0.9)';
      ctx.fillRect(bx, screenY - bh, bw, bh);
      ctx.fillStyle = 'rgba(255, 205, 120, 0.22)';
      for (let wy = 9; wy < bh - 12; wy += 17)
        for (let wx = 6; wx < bw - 8; wx += 13)
          if ((seed + wy * 3 + wx * 7) % 9 < 4) ctx.fillRect(bx + wx, screenY - bh + wy, 5, 7);
      if (seed % 5 === 0) {
        const nc = ['#ff5f7e', '#5fe0ff', '#ffd966', '#b07cff'][seed % 4];
        ctx.fillStyle = nc; ctx.globalAlpha = 0.55;
        ctx.fillRect(bx + 4, screenY - bh - 4, bw - 8, 3); ctx.globalAlpha = 1;
      }
    }
  }

  const fog = ctx.createLinearGradient(0, CH - 150, 0, CH);
  fog.addColorStop(0, 'rgba(11, 30, 48, 0)'); fog.addColorStop(1, 'rgba(11, 30, 48, 0.85)');
  ctx.fillStyle = fog; ctx.fillRect(0, CH - 150, CW, 150);
}

function drawPlatforms() {
  for (const p of platforms) {
    const sy = p.y - cameraY;
    if (sy < -60 || sy > CH + 60) continue;
    if (p.type === 'danger') {
      const glow = 0.5 + Math.sin(frame * 0.22) * 0.35;
      ctx.save(); ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 22 * glow;
      ctx.fillStyle = '#ef4444'; roundRect(p.x, sy, p.w, p.h, 7); ctx.fill(); ctx.restore();
      ctx.fillStyle = '#7f1d1d';
      for (let i = 5; i < p.w - 5; i += 13) ctx.fillRect(p.x + i, sy + 3, 6, p.h - 6);
      ctx.fillStyle = '#fecaca'; ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('✖', p.x + p.w / 2, sy + p.h / 2);
    } else {
      ctx.save(); ctx.shadowColor = '#4dd8ff'; ctx.shadowBlur = 16;
      const grad = ctx.createLinearGradient(p.x, sy, p.x, sy + p.h);
      grad.addColorStop(0, '#6ee6ff'); grad.addColorStop(1, '#1e8fb8');
      ctx.fillStyle = grad; roundRect(p.x, sy, p.w, p.h, 7); ctx.fill(); ctx.restore();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      roundRect(p.x + 5, sy + 2, p.w - 10, 3, 2); ctx.fill();
    }
  }
}

function drawBadges() {
  for (const b of badges) {
    const sy = b.y - cameraY;
    if (sy < -60 || sy > CH + 60) continue;
    const pulse = 1 + Math.sin(frame * 0.13 + b.phase) * 0.1;
    ctx.save(); ctx.translate(b.x, sy); ctx.scale(pulse, pulse);
    ctx.shadowColor = b.color; ctx.shadowBlur = 20;
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(0, 0, b.size / 2, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
    ctx.beginPath(); ctx.arc(0, 0, b.size / 2 - 4, 0, Math.PI * 2); ctx.fill();
    ctx.font = `${b.size * 0.52}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#081420'; ctx.fillText(b.icon, 0, 1);
    ctx.restore();
  }
}

function drawPlayer() {
  const sy = player.y - cameraY;
  const cx = player.x + player.w / 2;
  const stretch = 1 + Math.max(-0.14, Math.min(0.14, -player.vy * 0.011));
  const squash = 1 / stretch;

  ctx.save();
  ctx.translate(cx, sy + player.h); ctx.scale(squash, stretch); ctx.translate(-cx, -(sy + player.h));
  ctx.shadowColor = '#ffd966'; ctx.shadowBlur = 26;
  ctx.fillStyle = '#ffd966'; roundRect(player.x, sy, player.w, player.h, 11); ctx.fill();
  ctx.shadowBlur = 0;

  const eyeY = sy + player.h * 0.4;
  ctx.fillStyle = '#101828';
  ctx.beginPath(); ctx.arc(cx - 7, eyeY, 3.2, 0, Math.PI * 2); ctx.arc(cx + 7, eyeY, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(cx - 6, eyeY - 1, 1.1, 0, Math.PI * 2); ctx.arc(cx + 8, eyeY - 1, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#101828'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(cx, sy + player.h * 0.58, 5, 0.15, Math.PI - 0.15); ctx.stroke();
  ctx.fillStyle = '#a86f10'; ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('HK', cx, sy + player.h * 0.8);
  ctx.restore();

  if (player.canDoubleJump && gameState === 'playing') {
    ctx.strokeStyle = 'rgba(110, 200, 255, ' + (0.35 + Math.sin(frame * 0.2) * 0.2) + ')';
    ctx.lineWidth = 2; ctx.beginPath();
    ctx.arc(cx, sy + player.h / 2, player.w * 0.95, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawParticles() {
  for (const p of particles) {
    const sy = p.y - cameraY;
    if (sy < -40 || sy > CH + 40) continue;
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, sy, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  if (combo > 1) {
    const alpha = Math.min(1, comboTimer / 40);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffb43c'; ctx.font = 'bold 28px "PingFang HK", sans-serif';
    ctx.textAlign = 'center'; ctx.shadowColor = '#ff8c00'; ctx.shadowBlur = 16;
    ctx.fillText('COMBO ×' + combo, CW / 2, 54);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
}

function drawMenu() {
  ctx.fillStyle = 'rgba(4, 10, 20, 0.74)'; ctx.fillRect(0, 0, CW, CH);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd966'; ctx.font = 'bold 32px "PingFang HK", sans-serif';
  ctx.shadowColor = '#7a4d00'; ctx.shadowBlur = 20;
  ctx.fillText('香港經濟貢獻', CW / 2, CH / 2 - 90);
  ctx.fillText('無限爬升', CW / 2, CH / 2 - 46);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#6ec8ff'; ctx.font = '600 15px "PingFang HK", sans-serif';
  ctx.fillText('CES 中三專題 · 挑機版', CW / 2, CH / 2 + 4);
  ctx.fillStyle = '#a8c8e0'; ctx.font = '14px "PingFang HK", sans-serif';
  ctx.fillText('橫向搖桿左右移動，踩平台自動彈跳', CW / 2, CH / 2 + 62);
  ctx.fillText('跳躍掣可喺空中再跳一次', CW / 2, CH / 2 + 88);
  ctx.fillText('收集徽章 · 解鎖 AI 經濟知識卡', CW / 2, CH / 2 + 114);
  ctx.fillText('撳「📖 了解更多」睇深入數據 · A+ 放大閱讀', CW / 2, CH / 2 + 140);
  const alpha = 0.5 + Math.sin(frame * 0.08) * 0.45;
  ctx.globalAlpha = alpha; ctx.fillStyle = '#ffd966';
  ctx.font = 'bold 19px "PingFang HK", sans-serif';
  ctx.fillText('撳「開始」或空白鍵開波', CW / 2, CH - 110);
  ctx.globalAlpha = 1;
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(4, 10, 20, 0.8)'; ctx.fillRect(0, 0, CW, CH);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 38px "PingFang HK", sans-serif';
  ctx.shadowColor = '#7f1d1d'; ctx.shadowBlur = 22;
  ctx.fillText('GG！', CW / 2, CH / 2 - 120); ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffd966'; ctx.font = 'bold 30px "PingFang HK", sans-serif';
  ctx.fillText(altitude + ' 米', CW / 2, CH / 2 - 56);
  ctx.fillStyle = '#a8c8e0'; ctx.font = '16px "PingFang HK", sans-serif';
  ctx.fillText('徽章：' + badgeCount + ' 個', CW / 2, CH / 2 - 6);
  ctx.fillText('分數：' + score, CW / 2, CH / 2 + 26);
  ctx.fillText('解鎖領域：' + typesCollected.size + '/6', CW / 2, CH / 2 + 58);
  const alpha = 0.5 + Math.sin(frame * 0.08) * 0.45;
  ctx.globalAlpha = alpha; ctx.fillStyle = '#6ec8ff';
  ctx.font = 'bold 18px "PingFang HK", sans-serif';
  ctx.fillText('撳「再挑機」繼續', CW / 2, CH / 2 + 140);
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.clearRect(0, 0, CW, CH);
  drawBackground(); drawPlatforms(); drawBadges(); drawPlayer(); drawParticles(); drawHUD();
  if (gameState === 'menu') drawMenu();
  if (gameState === 'gameover') drawGameOver();
}

/* ============================================================
   主循環
   ============================================================ */
let lastTime = 0, accumulator = 0;
const STEP = 1000 / 60;

function loop(ts) {
  if (!lastTime) lastTime = ts;
  let delta = ts - lastTime; lastTime = ts;
  if (delta > 120) delta = 120;
  accumulator += delta;
  while (accumulator >= STEP) {
    frame++;
    if (gameState === 'playing') update();
    accumulator -= STEP;
  }
  draw();
  requestAnimationFrame(loop);
}

/* ============================================================
   跳跃按钮 + 键盘输入
   ============================================================ */
btnJump.addEventListener('pointerdown', (e) => { e.preventDefault(); doJump(); });
btnJump.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (gameState === 'menu' || gameState === 'gameover') startGame();
  else if (gameState === 'playing') doJump();
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
    keys.left = true;
    if (!joystickState.active) {
      setDirection(-1);
      renderJoystickVisual(-1);
      joystick.classList.add('active');
    }
    e.preventDefault();
  }
  if (e.code === 'ArrowRight' || e.code === 'KeyD') {
    keys.right = true;
    if (!joystickState.active) {
      setDirection(1);
      renderJoystickVisual(1);
      joystick.classList.add('active');
    }
    e.preventDefault();
  }
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (e.repeat) return;
    doJump();
  }
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
    keys.left = false;
    if (!joystickState.active) updateJoystickVisualFromKeys();
  }
  if (e.code === 'ArrowRight' || e.code === 'KeyD') {
    keys.right = false;
    if (!joystickState.active) updateJoystickVisualFromKeys();
  }
});

document.addEventListener('touchmove', (e) => {
  if (e.target.closest('.canvas-wrap') || e.target.closest('.controls-row')) e.preventDefault();
}, { passive: false });

document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

document.addEventListener('dragstart', (e) => e.preventDefault());
document.addEventListener('selectstart', (e) => e.preventDefault());

startBtn.addEventListener('click', startGame);

resetBtn.addEventListener('click', () => {
  if (gameState === 'playing') endGame();
  initGame();
  gameState = 'menu';
  startBtn.textContent = '▶ 開始';
  startBtn.disabled = false;
  setAIMessage(
    '喂！我係 <span class="hl">小港</span>，你嘅 AI 經濟顧問 🤖<br><br>' +
    '撳 <span class="hl">▶ 開始</span> 或 <span class="hl">空白鍵</span> 開波！<br><br>' +
    '用左下角 <span class="hl">橫向搖桿</span> 左右移動，撳 <span class="hl">跳躍</span> 掣喺空中再跳一次！<br><br>' +
    '收集徽章後可以撳 <span class="hl">📖 了解更多</span> 睇深入數據 🎓<br><br>' +
    '字太細？撳右上角 <span class="hl">A+</span> 放大閱讀！'
  );
  aiTip.textContent = '💡 空白鍵 / 點擊畫面開始';
  hideMoreButton();
});

/* ============================================================
   Resize 防抖 & 啟動
   ============================================================ */
let resizeTimer = null;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    resizeCanvas();
  }, 80);
}

window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 120));

requestAnimationFrame(() => {
  resizeCanvas();
  initGame();
  requestAnimationFrame(resizeCanvas);
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
